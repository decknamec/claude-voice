name: Check

# The actual purpose: prove that a fresh clone builds. The development machine
# already has node_modules, dist, the Whisper model and the Rust toolchain lying
# around, so everything runs there even when something is missing from the repo.
#
# What cannot be checked here: anything needing a microphone, the 547 MB Whisper
# model or a signed-in claude CLI. That boundary is real, and a green tick here
# does not mean speech works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface and server
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json

      # The smoke test calls tools the runner does not have. jq is
      # preinstalled, sox and whisper-cpp are not, and it does not need them:
      # it only inspects scripts and files.
      - name: Dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix ui

      - name: TypeScript
        run: npx --no-install tsc -b --noEmit
        working-directory: app

      - name: Build
        run: npx --no-install vite build
        working-directory: app

      - name: Unit tests
        run: |
          node --test tests/units.test.mjs
          cd app && node --test src/logic.test.ts

      - name: Smoke test
        run: tests/smoke.sh

      # The build has to be a single file that fetches nothing at runtime. The
      # page holds the session token and can drive Claude with tool access, so
      # no foreign script belongs in it.
      - name: Build is self-contained
        run: |
          n=$(ls app/dist | wc -l | tr -d ' ')
          [ "$n" = 1 ] || { echo "dist has $n files, expected 1"; ls -la app/dist; exit 1; }
          if grep -qE '<(script|link)[^>]+(src|href)="https?:' app/dist/index.html; then
            echo "The build pulls something in from outside:"
            grep -oE '<(script|link)[^>]+(src|href)="https?:[^"]*' app/dist/index.html
            exit 1
          fi

  shell:
    name: Desktop shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dependencies
        run: npm ci --prefix desktop

      # The frontendDist folder has to exist or tauri-build aborts. The window
      # loads the local server anyway, not that file.
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Formatting
        run: cargo fmt --check
        working-directory: desktop/src-tauri
