<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Voice</title>
<style>
/* ── Motion-Identität ────────────────────────────────────────────────
   Archetyp Premium: eine Signature-Kurve für ~80 % der Bewegung,
   drei Dauern, kein Overshoot. Ein Sprachassistent soll ruhig wirken. */
:root{
  --e: cubic-bezier(.4,0,.2,1);      /* signature */
  --e-out: cubic-bezier(.05,.7,.1,1); /* Entrances */
  --e-in: cubic-bezier(.3,0,1,1);     /* Exits */
  --t-quick:140ms; --t-std:280ms; --t-slow:520ms;

  --bg:#fbfaf9; --panel:#fff; --line:#e8e4df;
  --fg:#1a1714; --fg-dim:#7a736c;
  --accent:#5b5bd6; --accent-soft:#5b5bd622;
  --listen:#0d9488; --think:#b45309; --speak:#4f46e5; --err:#be123c;
  --shadow:0 1px 2px #1a171408, 0 8px 24px #1a171410;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d0c0f; --panel:#161519; --line:#26242b;
  --fg:#f2f0ee; --fg-dim:#8d8894;
  --accent:#8b8bf0; --accent-soft:#8b8bf01f;
  --listen:#2dd4bf; --think:#fbbf24; --speak:#a5b4fc; --err:#fb7185;
  --shadow:0 1px 2px #0006, 0 12px 32px #0008;
}}
:root[data-theme="dark"]{
  --bg:#0d0c0f; --panel:#161519; --line:#26242b;
  --fg:#f2f0ee; --fg-dim:#8d8894;
  --accent:#8b8bf0; --accent-soft:#8b8bf01f;
  --listen:#2dd4bf; --think:#fbbf24; --speak:#a5b4fc; --err:#fb7185;
  --shadow:0 1px 2px #0006, 0 12px 32px #0008;
}

*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
  font:15px/1.6 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
}

/* ── Ambient-Layer: der Hintergrund atmet, damit die Seite nie tot wirkt ── */
.ambient{
  position:fixed; inset:-30%; z-index:0; pointer-events:none;
  background:radial-gradient(closest-side, var(--glow,#5b5bd6) , transparent 70%);
  opacity:.10; filter:blur(60px);
  animation:breathe 11s var(--e) infinite;
  transition:background var(--t-slow) var(--e), opacity var(--t-slow) var(--e);
}
@keyframes breathe{
  0%,100%{transform:scale(1) translate(0,0)}
  50%    {transform:scale(1.14) translate(0,-2%)}
}

header{
  position:relative; z-index:1; width:100%; max-width:760px;
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:20px 24px; font-size:12.5px; color:var(--fg-dim);
}
/* Der Titel bricht nicht um; wird es eng, wandern die Chips in Zeile zwei. */
header b{white-space:nowrap;flex:none}
#cwd{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
     transition:background var(--t-std) var(--e)}
header b{color:var(--fg);font-weight:600}
header .sp{flex:1}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:3px 10px;
  background:var(--panel); white-space:nowrap;
}
button.chip{color:var(--fg-dim);cursor:pointer;font:inherit;font-size:12.5px;
  transition:color var(--t-quick) var(--e),border-color var(--t-quick) var(--e),
             transform var(--t-quick) var(--e)}
button.chip:hover{color:var(--fg);border-color:var(--fg-dim)}
button.chip:active{transform:scale(.96)}

button.chip.danger:hover{color:var(--err);border-color:var(--err)}
button.chip.active{color:var(--listen);border-color:var(--listen)}
/* Der Modus ohne Rückfrage schaltet jede Bestätigung ab — das soll man sehen. */
#perm.risky{color:var(--err);border-color:var(--err)}

select.sel{
  font:inherit; font-size:12.5px; color:var(--fg); cursor:pointer;
  max-width:190px; appearance:none; padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg-dim) 50%),
                   linear-gradient(135deg,var(--fg-dim) 50%,transparent 50%);
  background-position:right 11px center,right 7px center;
  background-size:4px 4px,4px 4px; background-repeat:no-repeat;
  transition:border-color var(--t-quick) var(--e);
}
select.sel:hover{border-color:var(--fg-dim)}
select.sel option:disabled{color:var(--fg-dim);opacity:.5}
select.sel:disabled{opacity:.45;cursor:not-allowed}

/* Abschlusszustand: die Seite wird ruhig gestellt statt einfach tot zu sein.
   Exit-Bewegung kürzer und beschleunigend — man verabschiedet sich zügig. */
body[data-state="off"] .ambient{opacity:0;transition:opacity var(--t-std) var(--e-in)}
body[data-state="off"] .orb{
  animation:none; transform:scale(.9); filter:grayscale(1) brightness(.7);
  pointer-events:none; box-shadow:none;
  transition:transform var(--t-std) var(--e-in), filter var(--t-std) var(--e-in),
             box-shadow var(--t-std) var(--e-in);
}
body[data-state="off"] header button,body[data-state="off"] canvas{opacity:.35;pointer-events:none}

/* ── Bühne ────────────────────────────────────────────────────────── */
main{position:relative;z-index:1;width:100%;max-width:760px;padding:0 24px 40px;
     display:flex;flex-direction:column;align-items:center;flex:1}
.stage{position:relative;width:300px;height:300px;display:grid;place-items:center;
       flex:none;margin:8px 0 4px}
canvas{position:absolute;inset:0;width:300px;height:300px}

/* Primary: der Orb. Press = Anticipation (scale .97) + Settle. */
.orb{
  position:relative; width:132px; height:132px; border-radius:50%;
  border:none; cursor:pointer; color:#fff;
  background:radial-gradient(circle at 35% 30%, #ffffff30, transparent 60%), var(--glow,#5b5bd6);
  box-shadow:0 8px 32px var(--glow,#5b5bd6)55, inset 0 1px 0 #ffffff40;
  display:grid; place-items:center;
  transition:transform var(--t-std) var(--e), background var(--t-slow) var(--e),
             box-shadow var(--t-slow) var(--e);
  animation:idlebreath 4.5s ease-in-out infinite;
}
@keyframes idlebreath{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.orb:hover{transform:scale(1.03)}
.orb:active{transform:scale(.97);transition-duration:var(--t-quick)}
.orb svg{width:44px;height:44px;transition:transform var(--t-std) var(--e-out)}
body[data-state="listening"] .orb{animation:none;transform:scale(1.04)}
body[data-state="thinking"] .orb,body[data-state="transcribing"] .orb{animation:none}
body[data-state="speaking"] .orb{animation:none}

/* Pulsringe: nur beim Zuhören, 1/3-Regel — genau zwei gleichzeitig. */
.pulse{position:absolute;inset:0;margin:auto;width:132px;height:132px;border-radius:50%;
  border:1.5px solid var(--glow,#5b5bd6);opacity:0;pointer-events:none}
body[data-state="listening"] .pulse{animation:ping 2.4s var(--e-out) infinite}
body[data-state="listening"] .pulse:nth-child(2){animation-delay:1.2s}
@keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}

/* Transcribing: Shimmer-Sweep quer über den Orb. */
.orb::after{
  content:"";position:absolute;inset:0;border-radius:50%;opacity:0;
  background:linear-gradient(105deg,transparent 30%,#ffffff5c 50%,transparent 70%);
  background-size:250% 100%;
}
body[data-state="transcribing"] .orb::after{opacity:1;animation:sweep 1.1s var(--e) infinite}
@keyframes sweep{0%{background-position:180% 0}100%{background-position:-80% 0}}

.label{
  margin-top:2px;font-size:13px;color:var(--fg-dim);height:20px;
  letter-spacing:.02em;transition:color var(--t-std) var(--e);
}
.meter{
  width:180px; height:3px; margin-top:12px; border-radius:2px;
  background:var(--line); overflow:hidden; opacity:0;
  transition:opacity var(--t-std) var(--e);
}
.meter span{display:block;height:100%;width:0;border-radius:2px;transition:width 80ms linear}

.preview{
  margin-top:10px; min-height:22px; max-width:560px; text-align:center;
  font-size:15px; line-height:1.45; color:var(--fg-dim);
  opacity:0; transition:opacity var(--t-std) var(--e);
}
.preview.on{opacity:1}
.preview b{color:var(--fg);font-weight:400}

.hint{font-size:12px;color:var(--fg-dim);opacity:.62;margin-top:6px;height:16px}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;background:var(--panel)}

/* Thinking: Dot-Kaskade, Stagger 140 ms (Micro-Cascade). */
.dots{display:flex;gap:6px;height:8px;align-items:center;margin-top:10px;opacity:0;
      transition:opacity var(--t-std) var(--e)}
body[data-state="thinking"] .dots{opacity:1}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--think);
        animation:hop 1.15s var(--e) infinite}
.dots i:nth-child(2){animation-delay:.14s}
.dots i:nth-child(3){animation-delay:.28s}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}

/* ── Verlauf ──────────────────────────────────────────────────────── */
.log{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:22px}
.msg{
  border:1px solid var(--line);background:var(--panel);border-radius:14px;
  padding:12px 15px;box-shadow:var(--shadow);
  animation:rise var(--t-slow) var(--e-out) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg .who{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
          color:var(--fg-dim);margin-bottom:5px}
.msg.me{border-color:var(--accent-soft);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--panel)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg .meta{font-size:11px;color:var(--fg-dim);margin-top:6px;opacity:.7}

/* Freigabe: die einzige Stelle, an der die UI den Nutzer aktiv blockiert —
   entsprechend deutlich, aber ohne Alarmfarbe. Entrance mit Anticipation. */
.perm{
  border:1px solid var(--think); border-radius:14px; padding:13px 15px;
  background:var(--panel); box-shadow:var(--shadow);
  animation:permin var(--t-slow) var(--e-out) both;
}
@keyframes permin{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:none}
}
.perm .who{color:var(--think)}
.perm pre{
  margin:8px 0 0; padding:9px 11px; border-radius:9px; background:var(--bg);
  border:1px solid var(--line); font-size:12px; line-height:1.45;
  overflow-x:auto; white-space:pre-wrap; word-break:break-word; max-height:190px;
}
.perm .row{display:flex;gap:8px;margin-top:11px}
.perm button{
  font:inherit; font-size:13px; padding:6px 14px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--fg);
  transition:transform var(--t-quick) var(--e), border-color var(--t-quick) var(--e),
             background var(--t-quick) var(--e);
}
.perm button:active{transform:scale(.96)}
.perm button.ok{border-color:var(--listen);color:var(--listen)}
.perm button.ok:hover{background:var(--listen);color:var(--panel)}
.perm button.no:hover{border-color:var(--err);color:var(--err)}
.perm.answered{opacity:.5;border-color:var(--line)}
.perm.answered .row{display:none}

/* Laufender Text bekommt eine Schreibmarke, damit man sieht, dass es weitergeht. */
.msg.live .body::after{
  content:"▍"; margin-left:1px; color:var(--fg-dim);
  animation:caret 1.05s steps(1) infinite;
}
@keyframes caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* Fehler: 3 Oszillationen, keine Überschwinger — Fehler sollen fest wirken. */
body[data-state="error"] .orb{animation:shake .38s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Einstellungen und Verlauf: gleiche Kachel wie die Aktivitätsspur, damit der
   Kopf nicht bei zehn Bedienelementen umbricht. */
.panel{
  width:100%; margin-top:16px; padding:14px 16px;
  border:1px solid var(--line); border-radius:12px; background:var(--panel);
  box-shadow:var(--shadow); animation:rise var(--t-std) var(--e-out) both;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px 18px;
}
.panel label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--fg-dim)}
.panel select{
  font:inherit; font-size:13px; color:var(--fg); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:7px 9px; cursor:pointer;
  transition:border-color var(--t-quick) var(--e);
}
.panel select:hover{border-color:var(--fg-dim)}
.panel select#perm.risky{color:var(--err);border-color:var(--err)}

.hist{display:block;max-height:260px;overflow-y:auto;padding:8px}
.hist .row{
  display:flex; gap:10px; align-items:baseline; padding:8px 10px; border-radius:9px;
  cursor:pointer; transition:background var(--t-quick) var(--e);
}
.hist .row:hover{background:var(--accent-soft)}
.hist .row.now{color:var(--listen);cursor:default}
.hist .row.now:hover{background:none}
.hist .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--fg)}
.hist .row.now .t{color:var(--listen)}
.hist .d{flex:none;font-size:11.5px;color:var(--fg-dim)}
.hist .empty{padding:10px;color:var(--fg-dim);font-size:13px}

/* Aktivitätsspur: bewusst nüchtern und dicht — sie soll überflogen werden,
   nicht gelesen. Monospace, weil hier Pfade und Befehle stehen. */
.act{
  width:100%; margin-top:18px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel); box-shadow:var(--shadow); overflow:hidden;
  animation:rise var(--t-std) var(--e-out) both;
}
.actinner{
  max-height:210px; overflow-y:auto; padding:10px 12px;
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg-dim);
}
.act .row{display:flex;gap:9px;align-items:baseline;white-space:pre-wrap;word-break:break-word}
.act .row + .row{margin-top:2px}
.act .nm{color:var(--accent);flex:none;min-width:64px}
.act .row.bad .nm{color:var(--err)}
.act .arg{flex:1;opacity:.85}
.act .res{opacity:.55}
.act .empty{opacity:.5}

@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition-duration:1ms!important}
}
</style>
</head>
<body data-state="idle">
<div class="ambient"></div>

<header>
  <span class="dot"></span><b>Claude Voice</b>
  <span class="sp"></span>
  <span class="chip" id="cwd" title="Arbeitsverzeichnis der Session">…</span>
  <span class="chip" id="cfg" title="Laufendes Modell">…</span>
  <button class="chip" id="settoggle" title="Sprachausgabe, Modell, Sprache, Berechtigungen">Einstellungen</button>
  <button class="chip" id="histtoggle" title="Frühere Sessions">Verlauf</button>
  <button class="chip" id="reset" title="Neue Session beginnen">Neue Session</button>
  <button class="chip" id="livetoggle" title="Freihändig: hört durchgehend zu, du kannst dazwischenreden">Freihändig</button>
  <button class="chip" id="acttoggle" title="Zeigt, welche Werkzeuge die Session benutzt">Aktivität</button>
  <button class="chip" id="stop" title="Laufenden Turn abbrechen (Esc)">Abbrechen</button>
  <button class="chip danger" id="quit" title="Server beenden und Session schließen">Beenden</button>
</header>

<main>
  <div class="stage">
    <canvas id="viz" width="600" height="600"></canvas>
    <span class="pulse"></span><span class="pulse"></span>
    <button class="orb" id="orb" aria-label="Aufnahme starten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/>
      </svg>
    </button>
  </div>
  <div class="label" id="label">Bereit</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="meter" id="meter"><span></span></div>
  <div class="preview" id="preview"></div>
  <div class="hint" id="hint">Klick zum Sprechen · <kbd>Leertaste</kbd> halten · <kbd>Esc</kbd> stoppt</div>
  <div class="panel" id="settings" hidden>
    <label>Sprachausgabe<select id="backend"></select></label>
    <label>Stimme<select id="voice"></select></label>
    <label>Modell<select id="model">
      <option value="">wie konfiguriert</option>
      <option value="claude-opus-5">Opus 5</option>
      <option value="claude-sonnet-5">Sonnet 5</option>
      <option value="claude-haiku-4-5">Haiku 4.5</option>
    </select></label>
    <label>Sprache<select id="lang">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="auto">automatisch erkennen</option>
    </select></label>
    <label>Werkzeuge<select id="perm">
      <option value="default">fragt nach</option>
      <option value="acceptEdits">Edits ohne Rückfrage</option>
      <option value="plan">nur planen</option>
      <option value="bypassPermissions">ohne jede Rückfrage</option>
    </select></label>
  </div>
  <div class="panel hist" id="history" hidden></div>
  <div class="log" id="log"></div>
  <div class="act" id="act" hidden><div class="actinner" id="actinner"></div></div>
</main>

<script>
const $ = s => document.querySelector(s)
const orb = $('#orb'), label = $('#label'), log = $('#log'), hint = $('#hint')
const viz = $('#viz'), ctx = viz.getContext('2d')

const GLOW = { idle:'--accent', listening:'--listen', transcribing:'--accent',
               thinking:'--think', speaking:'--speak', error:'--err', off:'--fg-dim',
               waiting:'--think' }
const TEXT = { idle:'Bereit', listening:'Hört zu…', transcribing:'Verstehe…',
               thinking:'Denkt nach…', speaking:'Spricht…', error:'Fehler',
               off:'Beendet — das Fenster kann zu',
               waiting:'Wartet auf deine Freigabe' }

let state = 'idle', stream, ac, analyser, data, rec, chunks = [], busy = false
// Muss vor draw() stehen: die Zeichenschleife startet sofort und liest live.on.
const live = { on:false, node:null, source:null, floor:0.012, level:0 }

function setState (s) {
  state = s
  document.body.dataset.state = s
  label.textContent = TEXT[s] || s
  const c = getComputedStyle(document.documentElement).getPropertyValue(GLOW[s] || '--accent').trim()
  document.documentElement.style.setProperty('--glow', c)
  document.querySelector('.ambient').style.background =
    `radial-gradient(closest-side, ${c}, transparent 70%)`
  $('.dot').style.background = c
}

function add (who, text, cls, meta) {
  const el = document.createElement('div')
  el.className = 'msg ' + (cls || '')
  el.innerHTML = `<div class="who"></div><div class="body"></div>` +
                 (meta ? `<div class="meta"></div>` : '')
  el.querySelector('.who').textContent = who
  el.querySelector('.body').textContent = text
  if (meta) el.querySelector('.meta').textContent = meta
  log.append(el)
  el.scrollIntoView({ behavior:'smooth', block:'end' })
  return el
}

/* ── Secondary-Layer: radiale Balken aus echten Analyser-Daten.
   Beim Sprechen gibt es keinen Analyser (say läuft serverseitig), da wird
   synthetisch moduliert — sichtbar lebendig, aber ruhiger als beim Zuhören. */
let phase = 0
function draw () {
  requestAnimationFrame(draw)
  const W = viz.width, C = W / 2
  ctx.clearRect(0, 0, W, W)
  const active = state === 'listening' || state === 'speaking'
  if (!active) return

  const col = getComputedStyle(document.documentElement).getPropertyValue('--glow').trim()
  const N = 72, R = 152
  phase += state === 'speaking' ? 0.055 : 0.02
  if (analyser && state === 'listening') analyser.getByteFrequencyData(data)

  ctx.lineCap = 'round'
  for (let i = 0; i < N; i++) {
    let v
    if (state === 'listening') {
      v = (data[Math.floor(i / N * (data.length * 0.55))] || 0) / 255
    } else {
      v = 0.18 + 0.5 * Math.abs(Math.sin(phase + i * 0.42)) * Math.abs(Math.cos(phase * 0.6 + i * 0.13))
    }
    const len = 5 + v * 74
    const a = (i / N) * Math.PI * 2 - Math.PI / 2
    ctx.strokeStyle = col
    ctx.globalAlpha = 0.20 + v * 0.7
    ctx.lineWidth = 3
    ctx.beginPath()
    ctx.moveTo(C + Math.cos(a) * R, C + Math.sin(a) * R)
    ctx.lineTo(C + Math.cos(a) * (R + len), C + Math.sin(a) * (R + len))
    ctx.stroke()
  }
  ctx.globalAlpha = 1
}
draw()

async function mic () {
  if (stream) return stream
  stream = await navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } })
  ac = new AudioContext()
  analyser = ac.createAnalyser()
  analyser.fftSize = 512
  analyser.smoothingTimeConstant = 0.75
  live.source = ac.createMediaStreamSource(stream)
  live.source.connect(analyser)
  data = new Uint8Array(analyser.frequencyBinCount)
  return stream
}

// ── Vorschau: zeigt, was gerade verstanden wird. Nicht die endgültige
//    Transkription — die läuft nach dem Loslassen über denselben Weg. ──
let previewBusy = false
async function previewTick () {
  if (previewBusy || state !== 'listening' || chunks.length < 2) return
  previewBusy = true
  try {
    const { said } = await post('/api/preview', new Blob(chunks, { type:'audio/webm' }),
                                'application/octet-stream')
    if (state === 'listening' && said) {
      const el = $('#preview')
      el.innerHTML = ''
      el.append(document.createTextNode('„'))
      const b = document.createElement('b'); b.textContent = said; el.append(b)
      el.append(document.createTextNode('"'))
      el.classList.add('on')
    }
  } catch {}         // die Vorschau ist Beiwerk; ein Fehler hier darf nichts stoppen
  finally { previewBusy = false }
}
function clearPreview () { const el = $('#preview'); el.classList.remove('on'); el.textContent = '' }

// ── Fehler: der rohe Text einer Ausnahme sagt dem Nutzer nichts darüber,
//    was er jetzt tun soll. ──
function describeError (err, code) {
  const m = String(err?.message || err || '')
  if (err?.name === 'NotAllowedError' || /Permission denied/i.test(m))
    return ['Kein Mikrofonzugriff',
            'Systemeinstellungen → Datenschutz → Mikrofon, dort Chrome erlauben. Danach die Seite neu laden.']
  if (err?.name === 'NotFoundError')
    return ['Kein Mikrofon gefunden', 'Ist ein Eingabegerät angeschlossen und ausgewählt?']
  if (code === 'no_model')
    return ['Whisper-Modell fehlt', 'Einmalig laden: siehe README, Abschnitt Installation.']
  if (code === 'whisper_failed' || code === 'ffmpeg_failed')
    return ['Spracherkennung fehlgeschlagen', m]
  if (/403/.test(m) || /Token/i.test(m))
    return ['Token ungültig', 'Diese Seite ohne das ?token= in der URL geöffnet? Starte claude-voice-ui neu.']
  if (err instanceof TypeError || /Failed to fetch|NetworkError/i.test(m))
    return ['Server nicht erreichbar', 'Läuft claude-voice-ui noch? Das Terminal-Fenster prüfen.']
  if (/usage limit|rate.?limit|429/i.test(m))
    return ['Limit erreicht', 'Die Anthropic-API bremst gerade. Kurz warten und erneut versuchen.']
  return ['Fehler', m || 'Unbekannte Ursache']
}

function showError (err, code) {
  const [title, hint] = describeError(err, code)
  const el = add(title, hint, 'err')
  setState('error'); setTimeout(() => setState('idle'), 1600)
  return el
}

async function start () {
  if (busy || state !== 'idle') return
  try { await mic() } catch (e) { showError(e); return }
  if (ac.state === 'suspended') await ac.resume()
  chunks = []
  rec = new MediaRecorder(stream, { mimeType:'audio/webm' })
  rec.ondataavailable = e => { if (e.data.size) { chunks.push(e.data); previewTick() } }
  rec.onstop = finish
  // Häppchenweise, damit die Vorschau schon während des Sprechens etwas hat.
  // Der erste Block trägt den Container-Header, also ist jedes Präfix gültiges webm.
  rec.start(900)
  vadMode(true)
  setState('listening')
  hint.textContent = 'Nochmal klicken oder Leertaste loslassen zum Senden'
}

function stopRec () {
  vadMode(false)
  if (rec && rec.state === 'recording') rec.stop()
}

// Der Server verlangt das Token bei jedem /api/-Aufruf. Es steht in unserer
// eigenen URL, also kann nur eine gleichherkünftige Seite es lesen.
const TOKEN = new URLSearchParams(location.search).get('token') || ''
const post = (path, body, type) => fetch(path, {
  method:'POST', body,
  headers: { 'x-voice-token': TOKEN, ...(type ? { 'content-type':type } : {}) }
}).then(async r => {
  const j = await r.json().catch(() => ({ error:'ungültige Antwort vom Server' }))
  if (!r.ok || j.error) {
    const e = new Error(j.error || `${r.status} ${r.statusText}`); e.code = j.code
    throw e
  }
  return j
})

async function finish () {
  busy = true
  hint.textContent = 'Klick zum Sprechen · Leertaste halten · Esc stoppt'
  try {
    setState('transcribing')
    clearPreview()
    const blob = new Blob(chunks, { type:'audio/webm' })
    const { said, ms:sttMs } = await post('/api/transcribe', blob, 'application/octet-stream')
    if (!said) { setState('idle'); busy = false; label.textContent = 'Nichts verstanden'; return }
    add('Du', said, 'me', sttMs + ' ms lokal transkribiert')

    // Ab hier übernimmt der Ereignisstrom: Text, Freigaben und das Ende des
    // Turns kommen über SSE, nicht als Antwort auf diesen Aufruf.
    setState('thinking')
    await post('/api/say', JSON.stringify({ text: said }), 'application/json')
  } catch (e) {
    showError(e, e.code)
  } finally { busy = false }
}

orb.addEventListener('click', () => state === 'listening' ? stopRec() : start())

let held = false
addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && !held) { e.preventDefault(); held = true; start() }
  if (e.code === 'Escape') { e.preventDefault(); interrupt() }
})
addEventListener('keyup', e => {
  if (e.code === 'Space' && held) { e.preventDefault(); held = false; stopRec() }
})

$('#reset').addEventListener('click', async () => {
  await post('/api/reset', '{}', 'application/json').catch(() => {})
  stopAudio()
  log.innerHTML = ''; act.innerHTML = ''; actRows.clear(); liveBubbleEl = null; busy = false
  setState('idle'); label.textContent = 'Neue Session'
})

$('#quit').addEventListener('click', async () => {
  if (state === 'listening') stopRec()
  hint.textContent = ''
  // Der Server antwortet noch, bevor er sich abbaut — schlägt fetch trotzdem
  // fehl, ist er schon weg, und das Ergebnis für den Nutzer ist dasselbe.
  await post('/api/shutdown', '{}', 'application/json').catch(() => {})
  es.close(); stopAudio(); live.on = false
  setState('off')
})

// ── Wiedergabe im Browser ────────────────────────────────────────────
// Der Server erzeugt das Audio nur noch; abgespielt wird es hier. Nur so
// erfasst die Echounterdrückung von getUserMedia die eigene Stimme — sonst
// hört das Mikrofon Claude und der Freihandmodus triggert auf sich selbst.
const player = { queue: [], el: new Audio(), playing: false }
player.el.preload = 'auto'

function playNext () {
  if (player.playing || !player.queue.length) return
  const id = player.queue.shift()
  player.playing = true
  player.el.src = `/api/audio/${id}?token=${encodeURIComponent(TOKEN)}`
  player.el.play().catch(() => { player.playing = false; playNext() })
}
player.el.addEventListener('ended', () => { player.playing = false; playNext() })
player.el.addEventListener('error', () => { player.playing = false; playNext() })

function stopAudio () {
  player.queue.length = 0
  player.el.pause(); player.el.removeAttribute('src'); player.el.load()
  player.playing = false
}
const speaking = () => player.playing || player.queue.length > 0

// ── Freihändig ───────────────────────────────────────────────────────
// Pegelbasierte Sprachaktivitätserkennung auf demselben Analyser, der auch
// die Waveform speist. Der Grundpegel wird beim Einschalten gemessen — ein
// fester Schwellwert taugt für einen ruhigen und einen lauten Raum nicht.


// Die Erkennung läuft im Audio-Thread. requestAnimationFrame steht in einem
// Hintergrund-Tab still (0 Hz) und Timer werden auf 1 Hz gedrosselt — beides
// unbrauchbar für einen Modus, dessen Sinn es ist, nebenbei zu reden.
const VAD_WORKLET = `
class Vad extends AudioWorkletProcessor {
  constructor () {
    super()
    // process() läuft je Renderquantum von 128 Samples — bei 48 kHz sind das
    // 2,67 ms. Blockzahlen deshalb aus der Abtastrate rechnen, nicht raten.
    const proSek = sampleRate / 128
    this.startB = Math.round(0.20 * proSek)   // so lange Sprache, bis er anspringt
    this.endB   = Math.round(0.90 * proSek)   // so lange Stille, bis er aufhört
    this.calibB = Math.round(1.00 * proSek)
    this.floor = 0.012; this.calib = []
    this.hot = 0; this.quiet = 0; this.recording = false; this.n = 0
    this.port.onmessage = e => {
      if (e.data.recording !== undefined) { this.recording = e.data.recording; this.hot = 0; this.quiet = 0 }
      if (e.data.recalibrate) { this.calib = [] }
      if (e.data.tune) {
        if (e.data.tune.startSec) this.startB = Math.round(e.data.tune.startSec * proSek)
        if (e.data.tune.endSec)   this.endB   = Math.round(e.data.tune.endSec * proSek)
      }
    }
  }
  process (inputs) {
    const ch = inputs[0] && inputs[0][0]
    if (!ch) return true
    let sum = 0
    for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i]
    const rms = Math.sqrt(sum / ch.length)

    if (this.calib.length < this.calibB) {
      this.calib.push(rms)
      if (this.calib.length === this.calibB) {
        // Median statt Maximum: ein einzelnes Klacken beim Einschalten würde
        // den Grundpegel sonst auf Sprachniveau heben und alles taub machen.
        const sorted = [...this.calib].sort((a, b) => a - b)
        const med = sorted[sorted.length >> 1]
        this.floor = Math.max(0.010, med * 3.5)
        this.port.postMessage({ type: 'ready', floor: this.floor })
      }
      return true
    }

    // Hysterese: zum Anspringen muss es deutlich über dem Grundpegel liegen,
    // zum Aufhören deutlich darunter. Ohne das zählen die Atempausen zwischen
    // zwei Wörtern schon als Satzende.
    if (this.recording) {
      this.quiet = rms < this.floor * 0.65 ? this.quiet + 1 : 0
      if (this.quiet > this.endB) { this.quiet = 0; this.port.postMessage({ type: 'end' }) }
    } else {
      this.hot = rms > this.floor ? this.hot + 1 : 0
      if (this.hot > this.startB) { this.hot = 0; this.port.postMessage({ type: 'start' }) }
    }
    if ((this.n++ % 12) === 0) this.port.postMessage({ type: 'level', rms, floor: this.floor })
    return true
  }
}
registerProcessor('vad', Vad)
`

async function attachVad () {
  if (live.node) return
  const url = URL.createObjectURL(new Blob([VAD_WORKLET], { type: 'application/javascript' }))
  await ac.audioWorklet.addModule(url)
  URL.revokeObjectURL(url)
  live.node = new AudioWorkletNode(ac, 'vad', { numberOfOutputs: 0 })
  live.source.connect(live.node)
  live.node.port.onmessage = e => onVad(e.data)
}

function onVad (m) {
  if (m.type === 'level') { live.level = m.rms; live.floor = m.floor; drawMeter(); return }
  if (m.type === 'ready') {
    live.floor = m.floor
    hint.textContent = 'Freihändig — sprich einfach los, du kannst dazwischenreden'
    return
  }
  if (!live.on) return
  if (m.type === 'start') {
    if (busy && !speaking()) return                       // denkt gerade
    if (speaking()) { stopAudio(); interrupt().then(start) }
    else if (!busy && state === 'idle') start()
  } else if (m.type === 'end') {
    if (state === 'listening') stopRec()
  }
}

// Der Worklet muss wissen, ob gerade aufgenommen wird — sonst kann er Anfang
// und Ende nicht unterscheiden.
function vadMode (recording) { live.node?.port.postMessage({ recording }) }

const meter = $('#meter')
function drawMeter () {
  if (!live.on) { meter.style.opacity = 0; return }
  meter.style.opacity = 1
  const pct = Math.min(100, (live.level / Math.max(live.floor * 2.2, 0.001)) * 100)
  meter.firstElementChild.style.width = pct + '%'
  meter.firstElementChild.style.background =
    live.level > live.floor ? 'var(--listen)' : 'var(--fg-dim)'
}

async function setLive (on) {
  live.on = on
  $('#livetoggle').classList.toggle('active', on)
  localStorage.setItem('claude-voice-live', on ? '1' : '0')
  if (!on) {
    hint.textContent = 'Klick zum Sprechen · Leertaste halten · Esc stoppt'
    drawMeter()
    return
  }
  try { await mic() } catch (e) { showError(e); setLive(false); return }
  if (ac.state === 'suspended') await ac.resume()
  try { await attachVad() } catch (e) { showError(e); live.on = false; return }
  live.node.port.postMessage({ recalibrate: true })
  hint.textContent = 'Kalibriere den Raumpegel…'
}
$('#livetoggle').addEventListener('click', () => setLive(!live.on))
// Nach dem Neuladen wieder anschalten — aber erst nach einer Nutzergeste,
// sonst verweigern Browser sowohl Mikrofon als auch Tonwiedergabe.
if (localStorage.getItem('claude-voice-live') === '1') {
  $('#livetoggle').classList.add('active')
  addEventListener('pointerdown', () => { if (!live.on) setLive(true) }, { once: true })
  hint.textContent = 'Freihändig ist vorgemerkt — einmal irgendwo klicken zum Aktivieren'
}

// ── Einstellungs- und Verlaufsleiste ─────────────────────────────────
function panelToggle (btn, panel, key, onOpen) {
  let open = localStorage.getItem(key) === '1'
  panel.hidden = !open
  btn.classList.toggle('active', open)
  if (open && onOpen) onOpen()
  btn.addEventListener('click', () => {
    open = !open
    panel.hidden = !open
    btn.classList.toggle('active', open)
    localStorage.setItem(key, open ? '1' : '0')
    if (open && onOpen) onOpen()
  })
}
panelToggle($('#settoggle'), $('#settings'), 'claude-voice-settings')

// ── Verlauf ──────────────────────────────────────────────────────────
const hist = $('#history')
function seit (ms) {
  const m = Math.round((Date.now() - ms) / 60000)
  if (m < 1) return 'gerade eben'
  if (m < 60) return `vor ${m} min`
  const h = Math.round(m / 60)
  if (h < 24) return `vor ${h} h`
  return `vor ${Math.round(h / 24)} Tagen`
}

async function ladeVerlauf () {
  hist.innerHTML = '<div class="empty">lädt…</div>'
  try {
    const { sessions } = await fetch('/api/sessions', { headers: { 'x-voice-token': TOKEN } })
      .then(r => r.json())
    hist.innerHTML = ''
    if (!sessions.length) { hist.innerHTML = '<div class="empty">Noch keine früheren Sessions in diesem Verzeichnis.</div>'; return }
    for (const x of sessions) {
      const row = document.createElement('div')
      row.className = 'row' + (x.aktuell ? ' now' : '')
      const t = document.createElement('span'); t.className = 't'
      t.textContent = x.titel + (x.aktuell ? '  · läuft gerade' : '')
      const d = document.createElement('span'); d.className = 'd'; d.textContent = seit(x.zuletzt)
      row.append(t, d)
      row.title = x.id
      if (!x.aktuell) row.addEventListener('click', () => fortsetzen(x.id, x.titel))
      hist.append(row)
    }
  } catch (e) { hist.innerHTML = ''; hist.append(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Verlauf nicht lesbar: ' + e.message })) }
}

async function fortsetzen (id, titel) {
  try {
    await post('/api/resume', JSON.stringify({ id }), 'application/json')
    stopAudio(); log.innerHTML = ''; act.innerHTML = ''; actRows.clear()
    liveBubbleEl = null; busy = false; setState('idle')
    add('Session', `Fortgesetzt: ${titel}`, '')
    ladeVerlauf()
  } catch (e) { showError(e, e.code) }
}
panelToggle($('#histtoggle'), $('#history'), 'claude-voice-hist', ladeVerlauf)

// ── Aktivitätsspur ───────────────────────────────────────────────────
// Eine lange Antwort mit Werkzeugaufrufen sieht sonst nach Stillstand aus.
const act = $('#actinner')
let actOpen = localStorage.getItem('claude-voice-act') === '1'
$('#act').hidden = !actOpen
$('#acttoggle').addEventListener('click', () => {
  actOpen = !actOpen
  $('#act').hidden = !actOpen
  localStorage.setItem('claude-voice-act', actOpen ? '1' : '0')
})

// Für die häufigen Werkzeuge das eine Feld zeigen, auf das es ankommt —
// das ganze Eingabeobjekt wäre hier nur Rauschen.
const ARG = { Bash:'command', Read:'file_path', Write:'file_path', Edit:'file_path',
              Glob:'pattern', Grep:'pattern', WebFetch:'url', Task:'description' }

function actLine (name, arg, bad) {
  const row = document.createElement('div')
  row.className = 'row' + (bad ? ' bad' : '')
  const n = document.createElement('span'); n.className = 'nm'; n.textContent = name
  const a = document.createElement('span'); a.className = 'arg'; a.textContent = arg
  row.append(n, a)
  act.append(row)
  act.scrollTop = act.scrollHeight
  return row
}

const actRows = new Map()

function onTool (d) {
  if (d.phase === 'use') {
    const key = ARG[d.name]
    const raw = key && d.input?.[key] != null ? String(d.input[key]) : JSON.stringify(d.input ?? {})
    actRows.set(d.id, actLine(d.name, raw.replace(/\s+/g, ' ').slice(0, 160)))
  } else {
    const row = actRows.get(d.id); actRows.delete(d.id)
    if (!row) return
    if (!d.ok) row.classList.add('bad')
    const r = document.createElement('span')
    r.className = 'res'
    r.textContent = d.ok ? (d.text ? '· ' + d.text.replace(/\s+/g, ' ').slice(0, 70) : '· ok') : '· fehlgeschlagen'
    row.append(r)
    act.scrollTop = act.scrollHeight
  }
}

// ── Beschriftung ─────────────────────────────────────────────────────
// Die Backends liefern Dateinamen und interne IDs. Was im Kopf steht, soll
// lesbar sein — die ID bleibt im title-Attribut, falls man sie doch braucht.
function prettyVoice (backend, id, name) {
  if (backend === 'piper') {
    const m = /^de_DE-([a-z_]+)-(x_low|low|medium|high)$/.exec(id)
    if (m) {
      const q = { x_low:'sehr grob', low:'grob', medium:'mittel', high:'fein' }[m[2]]
      return `${m[1][0].toUpperCase()}${m[1].slice(1).replace('_', ' ')} — ${q}`
    }
  }
  if (backend === 'edge') {
    const m = /^de-DE-(.+?)(Multilingual)?Neural$/.exec(id)
    if (m) return m[1] + (m[2] ? ' (mehrsprachig)' : '')
  }
  if (backend === 'elevenlabs') return (name || id).split(' - ')[0]
  return name || id
}

function prettyModel (id) {
  if (!id) return 'Standardmodell'
  const m = /^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id)
  if (!m) return id
  const fam = m[1][0].toUpperCase() + m[1].slice(1)
  return `${fam} ${m[2]}${m[3] ? '.' + m[3] : ''}`
}

function setPermUI (mode) {
  const sel = $('#perm')
  if ([...sel.options].some(o => o.value === mode)) sel.value = mode
  sel.classList.toggle('risky', sel.value === 'bypassPermissions')
}

$('#model').addEventListener('change', async e => {
  const model = e.target.value
  try {
    const r = await post('/api/model', JSON.stringify({ model }), 'application/json')
    add('Modell', (model ? prettyModel(model) : 'wie konfiguriert') +
        (r.applied ? '' : ' — gilt ab der nächsten Session'), '')
    if (r.applied) $('#cfg').textContent = prettyModel(model || null)
  } catch (err) { showError(err, err.code) }
})

$('#lang').addEventListener('change', async e => {
  const lang = e.target.value
  try {
    const r = await post('/api/language', JSON.stringify({ lang }), 'application/json')
    const name = e.target.options[e.target.selectedIndex].text
    add('Sprache', name + (r.restarted
      ? ' — neue Session gestartet, weil die Antwortsprache am Systemprompt hängt' : ''), '')
    if (r.restarted) { log.querySelectorAll('.msg.live').forEach(x => x.remove()); liveBubbleEl = null }
  } catch (err) { showError(err, err.code) }
})

$('#perm').addEventListener('change', async e => {
  const mode = e.target.value
  try {
    const r = await post('/api/permission-mode', JSON.stringify({ mode }), 'application/json')
    setPermUI(mode)
    add('Modus', `Werkzeuge: ${PERM[mode]}` +
        (r.applied ? '' : ' — gilt ab der nächsten Session'), '')
  } catch (err) { showError(err, err.code) }
})

const PERM = {
  default: 'fragt nach', auto: 'fragt nach', acceptEdits: 'Edits ohne Rückfrage',
  bypassPermissions: 'ohne jede Rückfrage', dontAsk: 'ohne Rückfrage', plan: 'nur planen'
}

// ── Ereignisstrom ────────────────────────────────────────────────────
// Eine persistente Session auf der Serverseite heißt: der Server redet von
// sich aus. Alles unterhalb eines Turns läuft über diesen Kanal.
let liveBubbleEl = null   // die Blase, in die gerade Text tropft

function liveBubble () {
  if (liveBubbleEl) return liveBubbleEl
  liveBubbleEl = add('Claude', '', 'live')
  return liveBubbleEl
}

const es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN))

es.addEventListener('delta', e => {
  const { text } = JSON.parse(e.data)
  const el = liveBubble()
  el.querySelector('.body').textContent += text
  if (state !== 'speaking') setState('speaking')
  el.scrollIntoView({ behavior:'smooth', block:'end' })
})

es.addEventListener('message', e => {
  // Die vollständige Nachricht ersetzt den zusammengetropften Text.
  const { text } = JSON.parse(e.data)
  const el = liveBubble()
  el.querySelector('.body').textContent = text
  el.classList.remove('live')
  liveBubbleEl = null
})

es.addEventListener('done', () => {
  if (liveBubbleEl) { liveBubbleEl.classList.remove('live'); liveBubbleEl = null }
  busy = false
  const settle = () => { if (!speaking()) setState('idle'); else setTimeout(settle, 200) }
  settle()
})

es.addEventListener('error', e => {
  try {
    const { message } = JSON.parse(e.data)
    showError(new Error(message))
  } catch {}   // Verbindungsabbrüche kommen ohne data — EventSource verbindet selbst neu
  busy = false
})

es.addEventListener('tool', e => onTool(JSON.parse(e.data)))

es.addEventListener('audio', e => { player.queue.push(JSON.parse(e.data).id); playNext() })
es.addEventListener('audio-stop', stopAudio)

es.addEventListener('state', e => {
  const { state: st } = JSON.parse(e.data)
  if (st === 'idle') { setState('idle'); busy = false }
})

// Freigabe: der Server hält den Tool-Aufruf an, bis hier geantwortet wird.
es.addEventListener('permission', e => {
  const { id, tool, input } = JSON.parse(e.data)
  setState('waiting')
  const el = document.createElement('div')
  el.className = 'perm'
  el.innerHTML = '<div class="who"></div><div class="body"></div>' +
                 '<pre></pre><div class="row">' +
                 '<button class="ok">Erlauben</button>' +
                 '<button class="no">Ablehnen</button></div>'
  el.querySelector('.who').textContent = 'Freigabe erforderlich'
  el.querySelector('.body').textContent = `Claude möchte ${tool} benutzen.`
  el.querySelector('pre').textContent = JSON.stringify(input, null, 2)
  const answer = behavior => {
    el.classList.add('answered')
    el.querySelector('.body').textContent =
      `${tool} — ${behavior === 'allow' ? 'erlaubt' : 'abgelehnt'}`
    setState('thinking')
    post('/api/permission', JSON.stringify({ id, behavior }), 'application/json')
      .catch(err => add('Fehler', err.message, 'err'))
  }
  el.querySelector('.ok').addEventListener('click', () => answer('allow'))
  el.querySelector('.no').addEventListener('click', () => answer('deny'))
  log.append(el)
  el.scrollIntoView({ behavior:'smooth', block:'end' })
})

// Abbruch: hält Sprachausgabe und laufenden Turn an. Das ist das Barge-in.
async function interrupt () {
  await post('/api/interrupt', '{}', 'application/json').catch(() => {})
  stopAudio()
  if (liveBubbleEl) { liveBubbleEl.classList.remove('live'); liveBubbleEl = null }
  busy = false
  setState('idle')
}
$('#stop').addEventListener('click', interrupt)

// ── Backend- und Stimmenwahl ─────────────────────────────────────────
let BACKENDS = [], pick = { backend: null, voice: null }
try { pick = { ...pick, ...JSON.parse(localStorage.getItem('claude-voice-tts') || '{}') } } catch {}
const remember = () => localStorage.setItem('claude-voice-tts', JSON.stringify(pick))

function fillVoices () {
  const b = BACKENDS.find(x => x.id === pick.backend)
  const sel = $('#voice')
  sel.innerHTML = ''
  if (!b || !b.voices.length) {
    sel.disabled = true
    sel.append(new Option(b && b.id === 'auto' ? 'Stimme aus Konfig' : '—', ''))
    return
  }
  sel.disabled = false
  for (const v of b.voices) {
    const o = new Option(prettyVoice(b.id, v.id, v.name), v.id)
    o.title = v.id
    o.selected = v.id === pick.voice
    sel.append(o)
  }
  // Gemerkte Stimme gehört zu einem anderen Backend -> auf dessen Default zurück.
  if (!b.voices.some(v => v.id === pick.voice)) {
    pick.voice = b.voices.some(v => v.id === b.default) ? b.default : b.voices[0].id
    sel.value = pick.voice
  }
}

fetch('/api/backends', { headers:{ 'x-voice-token':TOKEN } }).then(r => r.json()).then(d => {
  BACKENDS = d.backends
  const sel = $('#backend')
  sel.innerHTML = ''
  for (const b of BACKENDS) {
    // Nicht verfügbare bleiben sichtbar, aber ausgegraut — mit dem Grund im
    // Label, sonst rät man, warum ElevenLabs nicht wählbar ist.
    const o = new Option(b.available ? b.label : `${b.label} — ${b.detail}`, b.id)
    o.disabled = !b.available
    o.title = b.detail
    sel.append(o)
  }
  const avail = BACKENDS.filter(b => b.available).map(b => b.id)
  if (!avail.includes(pick.backend)) pick.backend = avail.includes(d.active) ? d.active : avail[0]
  sel.value = pick.backend
  fillVoices(); remember()
}).catch(() => { $('#backend').innerHTML = '<option>Backends nicht lesbar</option>' })

$('#backend').addEventListener('change', e => {
  pick.backend = e.target.value; pick.voice = null; fillVoices(); remember()
})
$('#voice').addEventListener('change', e => { pick.voice = e.target.value; remember() })

fetch('/api/config', { headers:{ 'x-voice-token':TOKEN } }).then(r => r.json()).then(c => {
  const home = c.cwd && c.cwd.match(/^\/Users\/[^/]+/)?.[0]
  const cwdEl = $('#cwd')
  if (cwdEl) {
    cwdEl.textContent = home ? c.cwd.replace(home, '~') : (c.cwd || '?')
    cwdEl.title = c.cwd || ''
  }
  $('#cfg').textContent = prettyModel(c.model)
  $('#cfg').title = c.model || 'aus deiner Konfiguration'
  setPermUI(c.permissionMode)
  if (c.modelOverride) $('#model').value = c.modelOverride
  if (c.lang) $('#lang').value = c.lang
}).catch(() => {})

// Diagnosezugang: die Zustandsvariablen sind skript-lokal und sonst von außen
// unsichtbar. Nur lesend, plus zwei Handgriffe zum Nachstellen.
window.__voice = {
  get state () { return state },
  get busy () { return busy },
  get level () { return levelNow() },
  live, player,
  recState: () => rec?.state ?? null,
  trackLive: () => stream?.getAudioTracks().map(t => ({ ready: t.readyState, enabled: t.enabled })),
  setLive, start, stopRec,
  // Nachstellen ohne Neuladen: __voice.tune({ endSec: 1.4 })
  tune: o => live.node?.port.postMessage({ tune: o }),
  recalibrate: () => live.node?.port.postMessage({ recalibrate: true })
}

setState('idle')
</script>
</body>
</html>
